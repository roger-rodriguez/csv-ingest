name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Crate version without the v prefix (for example, 0.3.0)
        required: true
        type: string

run-name: Publish csv_ingest v${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate csv_ingest v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_VERSION: ${{ inputs.version }}

    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Release publishing must run from main, not $RELEASE_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version
        run: |
          actual_version=$(cargo metadata --no-deps --format-version 1 \
            | jq --raw-output '.packages[] | select(.name == "csv_ingest") | .version')
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected csv_ingest $EXPECTED_VERSION, found $actual_version" >&2
            exit 1
          fi

      - name: Verify crates.io package
        run: cargo publish --package csv_ingest --locked --dry-run

  publish:
    name: Publish csv_ingest v${{ inputs.version }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish csv_ingest
        run: cargo publish --package csv_ingest --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
