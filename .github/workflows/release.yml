name: Publish to crates.io

on:
  workflow_dispatch:
    inputs:
      version:
        description: Crate version without the v prefix (for example, 0.3.0)
        required: true
        type: string

run-name: Publish csv_ingest v${{ inputs.version }}

permissions:
  contents: read

concurrency:
  group: crates-io-publish
  cancel-in-progress: false

jobs:
  validate:
    name: Validate csv_ingest v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      EXPECTED_VERSION: ${{ inputs.version }}

    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
            echo "Release publishing must run from main, not $RELEASE_REF" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Verify version
        run: |
          actual_version=$(cargo metadata --no-deps --format-version 1 \
            | jq --raw-output '.packages[] | select(.name == "csv_ingest") | .version')
          if [[ "$actual_version" != "$EXPECTED_VERSION" ]]; then
            echo "Expected csv_ingest $EXPECTED_VERSION, found $actual_version" >&2
            exit 1
          fi

      - name: Verify crates.io package
        run: cargo publish --package csv_ingest --locked --dry-run

  publish:
    name: Publish csv_ingest v${{ inputs.version }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish csv_ingest
        run: cargo publish --package csv_ingest --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  github-release:
    name: Create GitHub release v${{ inputs.version }}
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout published commit
        uses: actions/checkout@v6

      - name: Prepare release notes
        run: |
          awk -v version="$VERSION" '
            index($0, "## [" version "]") == 1 {
              capture = 1
              next
            }
            capture && /^## / {
              exit
            }
            capture {
              print
            }
          ' CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"

          if [[ ! -s "$RUNNER_TEMP/release-notes.md" ]]; then
            echo "No changelog section found for $VERSION" >&2
            exit 1
          fi

      - name: Create or verify tag
        run: |
          tag="v$VERSION"
          remote_target=$(git ls-remote origin "refs/tags/$tag^{}" | awk '{print $1}')

          if [[ -z "$remote_target" ]]; then
            remote_target=$(git ls-remote origin "refs/tags/$tag" | awk '{print $1}')
          fi

          if [[ -n "$remote_target" ]]; then
            if [[ "$remote_target" != "$GITHUB_SHA" ]]; then
              echo "$tag points to $remote_target, expected $GITHUB_SHA" >&2
              exit 1
            fi
            echo "$tag already points to the published commit"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$GITHUB_SHA" --message "csv_ingest $tag"
          git push origin "$tag"

      - name: Create GitHub release
        run: |
          tag="v$VERSION"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "GitHub release $tag already exists"
            exit 0
          fi

          gh release create "$tag" \
            --verify-tag \
            --title "csv_ingest $tag" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
