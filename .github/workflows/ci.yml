name: CI

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:
  schedule:
    # Nightly at 06:00 UTC (2am ET)
    - cron: "0 6 * * *"

env:
  # Cargo caches can move between runners with different CPU features.
  RUSTFLAGS: ""

jobs:
  msrv:
    name: MSRV (Rust 1.82)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust 1.82
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Test core on MSRV
        run: cargo test --package csv_ingest --all-targets --all-features --locked --no-fail-fast

  coverage:
    name: Coverage gate (95% lines)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust with coverage tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.6
          fallback: none

      - name: Enforce library coverage
        run: >-
          cargo llvm-cov
          --package csv_ingest
          --all-features
          --all-targets
          --ignore-filename-regex '(^|/)(bin|examples)/'
          --fail-under-lines 95
          --fail-under-file-lines 90
          --summary-only

  build-test-bench:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy (warnings as errors)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Build core (default features)
        run: cargo build --package csv_ingest --release --locked

      - name: Build development tools
        run: cargo build --package csv_ingest_tools --release --locked --features fast_local

      - name: Test core
        run: cargo test --package csv_ingest --all-targets --all-features --locked --no-fail-fast

      - name: Test development tools
        run: cargo test --package csv_ingest_tools --all-targets --all-features --locked --no-fail-fast

      - name: Verify crates.io package
        run: cargo package --package csv_ingest --locked

      # ---- Local perf smoke: generate CSV and run bench ----
      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Generate 5M rows (zstd)
        run: |
          mkdir -p data
          # gen & bench binaries built by the development-tools step
          ./target/release/gen --rows 5000000 --with-header | zstd -T0 -q -o data/5m.csv.zst
          ls -lh data

      - name: Bench (local file)
        id: bench
        run: |
          set -euo pipefail
          OUT=$(./target/release/bench --path data/5m.csv.zst --required sku)
          echo "$OUT"
          # Extract rows/sec if present (last token)
          RPS=$(echo "$OUT" | awk '/rows\/sec=/{print $NF}' | tail -n1)
          echo "rps=$RPS" >> "$GITHUB_OUTPUT"

      - name: Publish summary
        if: always()
        env:
          RPS: ${{ steps.bench.outputs.rps }}
        run: |
          {
            echo "## csv_ingest CI Summary"
            echo ""
            echo "**Rust:** stable"
            echo ""
            echo "### Bench (5M rows, zstd)"
            echo '```'
            ./target/release/bench --path data/5m.csv.zst --required sku || true
            echo '```'
            if [ -n "${RPS:-}" ]; then
              echo ""
              echo "- Parsed rows/sec: **${RPS}**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
