[package]
name = "csv_ingest"
version = "0.2.2"
edition = "2021"
rust-version = "1.82"
license = "MIT"
description = "Library for parsing CSV files. It focuses on high throughput, low memory, and correctness by default."
repository = "https://github.com/roger-rodriguez/csv-ingest"
readme = "../../README.md"
keywords = ["csv", "streaming", "ingest", "parsing"]
categories = [
  "data-structures",
  "encoding",
  "filesystem",
  "parser-implementations",
]
include = [
  "src/**",
  "examples/**",
  "LICENSE",
]

[lib]
name = "csv_ingest"
path = "src/lib.rs"

[features]
default = []
fast_local = ["memmap2", "memchr"]

[dependencies]
async-compression = { version = "0.4", features = ["tokio", "gzip", "zstd"] }
bytes = "1"
csv-async = { version = "1", default-features = false, features = ["tokio"] }
encoding_rs = "0.8"
tokio = { version = "1", features = [
  "fs",
  "io-util",
  "macros",
  "rt-multi-thread",
] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
crc32fast = "1"
memmap2 = { version = "0.9", optional = true }
memchr = { version = "2.7", optional = true }
thiserror = { version = "2.0.16" }

[dev-dependencies]
anyhow = "1"
proptest = { version = "~1.9.0", default-features = false, features = ["std"] }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
